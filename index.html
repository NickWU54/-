const currentGame=()=>state.games[state.kind];
const currentPage=()=>state.pages[state.pageIndex];
const selectedComponent=()=>currentPage().components.find(c=>c.id===state.selected);

const displayTime=v=>v?String(v).replace('T',' '):'未设置';
const now=()=>new Date().toLocaleTimeString('zh-CN',{hour12:false});
const opt=(v,l,selected)=>`<option value="${esc(v)}" ${String(v)===String(selected)?'selected':''}>${esc(l)}</option>`;
const options=(list,selected)=>list.map(x=>Array.isArray(x)?opt(x[0],x[1],selected):opt(x,x,selected)).join('');
const setPath=(o,path,v)=>{const p=path.split('.');const last=p.pop();let t=o;for(const k of p)t=t[k];t[last]=v;};
const btn=(label,act,cls='',extra='')=>`<button type="button" class="${cls}" data-act="${act}" ${extra}>${label}</button>`;
const field=(label,control,note='',required=false,wide=false)=>`<label class="field ${wide?'wide':''}"><span class="${required?'required':''}">${label}</span>${control}${note?`<div class="field-note">${note}</div>`:''}</label>`;
const ci=(path,type='text',extra='')=>{let v=path.split('.').reduce((o,k)=>o[k],currentGame());return `<input type="${type}" value="${esc(v)}" data-cfg="${path}" ${extra}>`;};
const cs=(path,list)=>`<select data-cfg="${path}">${options(list,path.split('.').reduce((o,k)=>o[k],currentGame()))}</select>`;
const checkbox=(path,label)=>`<label class="check-label"><input type="checkbox" data-cfg="${path}" ${path.split('.').reduce((o,k)=>o[k],currentGame())?'checked':''}>${label}</label>`;
const radio=(path,list)=>`<div class="radio-options">${list.map(([v,l])=>`<label><input type="radio" name="${path}" data-cfg="${path}" value="${v}" ${path.split('.').reduce((o,k)=>o[k],currentGame())===v?'checked':''}>${l}</label>`).join('')}</div>`;
function persist(){const snapshot=JSON.stringify(state);try{localStorage.setItem(STORE,snapshot);storageAvailable=true;}catch{storageAvailable=false;}try{window.parent.postMessage({type:'jiufang-pc-state',state:JSON.parse(snapshot)},'*');}catch{}}

function configView(){const g=currentGame();return `<main class="body-area"><div class="page-heading"><div><h1>创建任务玩法</h1><p>配置任务规则与奖励，保存后可在页面组装中关联使用</p></div><span class="pill ${g.saved?'green':''}">${g.saved?'已保存草稿':'编辑中'}</span><span class="spacer"></span><span class="save-time">${g.savedAt?'保存于 '+g.savedAt:''}</span>${btn('前往页面搭建 '+ico('arrow'),'to-builder','')}</div><div class="wizard"><div class="step-bar">${['玩法选择','基础信息配置','任务行为选择','发奖领奖配置'].map((s,i)=>`<button class="step ${state.step===i?'active':state.step>i?'done':''}" data-act="step" data-index="${i}"><span class="step-number">${state.step>i?'✓':i+1}</span><span class="step-name">${s}</span></button>`).join('')}</div><div class="wizard-content">${error?`<div class="error-banner" role="alert">${esc(error)}</div>`:''}${[chooseView,basicView,tasksView,rewardsView][state.step]()}</div><footer class="wizard-footer"><span class="footnote">当前玩法：${gameLabel(state.kind)}<span style="margin:0 10px;color:#d2d8e2">|</span>${g.id}</span><span class="spacer"></span>${btn('保存草稿','save-draft')}${state.step?btn('上一步','previous'):''}${btn(state.step===3?'保存玩法并去搭建':'下一步','next','primary')}</footer></div></main>`;}
function chooseView(){return `<h2 class="section-title">选择玩法类型</h2><p class="section-sub">同一套社区行为，可以通过不同玩法激励用户参与。</p><div class="game-choices">${['ladder','lottery'].map(k=>`<button class="game-card ${state.kind===k?'selected':''}" data-act="choose-game" data-kind="${k}"><div class="game-illus ${k}">${k==='ladder'?'<div class="mini-stairs"><div><b>¥5</b>1篇</div><div><b>¥20</b>4篇</div><div><b>¥50</b>8篇</div></div>':'<div class="mini-wheel"></div>'}</div><span class="check-corner">✓</span><div class="game-info"><h2>${gameLabel(k)}<span class="pill ${k==='ladder'?'blue':'orange'}">${k==='ladder'?'P0 · 优先建设':'P1'}</span></h2><p>${k==='ladder'?'按累计次数、累计天数、连续天数或每周达标设置阶梯，用户达标后获得对应奖励资格。':'用户完成任务获得抽奖机会，按配置的奖池概率抽取奖励，支持次数和库存限制。'}</p><div class="game-example">${k==='ladder'?'示例：30天内发4篇观点，领取20元现金红包':'示例：浏览观点15秒得1次机会，抽现金或实物'}</div></div></button>`).join('')}</div>`;}
function basicView(){const g=currentGame();return `<h2 class="section-title">基础信息</h2><div class="basic-grid">${field('玩法名称',ci('name','text','maxlength="40"'),'仅用于运营管理，可与活动前端标题不同',true)}${field('关联活动',ci('activity'),'用于归属活动与数据统计',true)}${field('开始时间',ci('start','datetime-local'),'',true)}${field('结束时间',ci('end','datetime-local'),'',true)}${field('共同编辑人',ci('owner'))}${field('玩法类型',`<div class="fake-input">${gameLabel(state.kind)} · ${g.id}</div>`)}</div><hr class="form-sep"><h2 class="section-title">投放设置</h2><div class="basic-grid">${field('投放人群',cs('audience',[['all','全部社区用户'],['segment','指定人群包'],['whitelist','指定用户白名单']]),'',true)}${g.audience!=='all'?field(g.audience==='segment'?'人群包名称':'用户ID',g.audience==='segment'?ci('audienceName'):`<textarea data-cfg="whitelist" placeholder="每行一个用户ID">${esc(g.whitelist)}</textarea>`,'按配置人群校验参与资格',true):field('排除人群',ci('exclude','text','placeholder="选择或输入排除人群，可选"'))}${field('投放城市',ci('cities'),'支持全国或指定城市；多个城市用逗号分隔')}${field('灰度比例',`<div class="inline-field">${ci('gray','number','min="0" max="100"')}<span>%</span></div>`,'0%仅对白名单开放，100%向符合条件的用户开放')}${field('测试白名单',`<textarea data-cfg="whitelist" placeholder="每行一个用户ID">${esc(g.whitelist)}</textarea>`,'用于运营预览与验收；不影响已配置的正常投放范围',false,true)}</div>`;}
function tasksView(){const g=currentGame(),r=g.rules;return `<h2 class="section-title">${state.kind==='ladder'?'阶梯累计规则':'抽奖机会规则'}</h2>${state.kind==='ladder'?`<div class="rule-row">${field('统计方式',cs('rules.mode',[['count','累计次数'],['days','累计天数'],['continuous','连续天数'],['weekly','每周达标']]),'',true)}${field('统计周期',cs('rules.period',[['activity','整个活动周期'],['week','每个自然周'],['day','每日']]),'',true)}${field('阶梯主任务',cs('rules.mainTask',g.tasks.filter(t=>t.enabled).map(t=>[t.id,t.name])), '阶梯进度按此任务累计',true)}${field(r.mode==='weekly'?'每周至少完成':r.mode==='continuous'?'中断处理':'每日最多计入',r.mode==='continuous'?cs('rules.reset',[['restart','中断后重新累计'],['retain','保留最高连续记录']]):`<div class="field-unit">${ci(r.mode==='weekly'?'rules.weeklyGoal':'rules.dailyMax','number','min="1" max="100"')}<em>次</em></div>`)}</div><div class="data-wrap"><table class="data-table"><thead><tr><th style="width:80px">阶梯</th><th>达标条件</th><th>奖励</th><th>总库存</th><th>操作</th></tr></thead><tbody>${g.tiers.map((t,i)=>`<tr><td>第 ${i+1} 档</td><td><div class="inline-field"><span>${r.mode==='weekly'?'达标':r.mode==='continuous'?'连续':'累计'}</span><input aria-label="第${i+1}档门槛" type="number" min="1" data-tier="${i}" data-key="threshold" value="${t.threshold}"><span>${metricUnit()}</span></div></td><td>${esc(t.name)}</td><td>${t.stock} 份</td><td>${btn('移除','delete-tier','link danger',`data-index="${i}" ${g.tiers.length===1?'disabled':''}`)}</td></tr>`).join('')}</tbody></table></div><div class="table-bottom">${btn('+ 添加阶梯','add-tier','link')}<span>奖励内容在下一步配置</span></div>`:`<div class="rule-row">${field('每日抽奖上限',ci('rules.drawDay','number','min="1"'))}${field('活动内抽奖上限',ci('rules.drawTotal','number','min="1"'))}${field('每人活动内最多中奖',ci('rules.winningMax','number','min="1"'))}${field('机会有效期',cs('rules.chanceExpiry',[['activity','活动结束前有效'],['day','当日有效']]))}</div><div class="rule-row">${field('免费赠送机会',ci('rules.freeChances','number','min="0"'))}${field('赠送周期',cs('rules.freePeriod',[['day','每日'],['activity','活动期间一次']]))}${field('每日中奖上限',ci('rules.winningDay','number','min="1"'))}</div><div class="help-banner">${ico('info')}任务完成后自动增加机会，用户需要主动点击抽奖。各任务可分别配置奖励次数。</div>`}<hr class="form-sep"><div class="row between"><h2 class="section-title">关联社区任务</h2>${btn('+ 添加任务行为','add-tasks','small')}</div><div class="data-wrap"><table class="data-table"><thead><tr><th>任务名称 / 行为</th><th>关联目标</th><th>任务周期</th><th>${state.kind==='lottery'?'完成奖励':'完成要求'}</th><th>操作</th></tr></thead><tbody>${g.tasks.map(t=>`<tr><td><div class="task-title"><span class="behavior-icon">${ico(actionIcon(t.type))}</span><div>${esc(t.name)}<div class="task-sub" style="margin-top:5px">${actionNames[t.type]}</div></div></div></td><td>${esc(t.targetValue||t.target)}<div class="task-sub" style="margin-top:5px">${taskRule(t)}</div></td><td>${cycleLabel(t.cycle)}<div class="task-sub" style="margin-top:5px">每周期最多 ${t.limit} 次</div></td><td>${state.kind==='lottery'?(t.hasLevels?`${t.levels.length} 关 · 分档发机会`:`+${t.chance} 次抽奖机会`):`完成 ${t.goal} 次`}</td><td class="table-action">${btn('配置','edit-task','link',`data-id="${t.id}"`)}${btn('移除','delete-task','link danger',`data-id="${t.id}"`)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty-table">请选择需要激励的社区任务</td></tr>'}</tbody></table></div>${state.kind==='ladder'&&g.rules.mode==='days'?`<div class="help-banner neutral" style="margin-top:15px">${ico('info')}累计天数按每日任务达标计1天；同一天完成多次不会增加多天。</div>`:''}<p class="rule-description">发观点、关注、浏览、点赞、收藏、评论与分享邀请均可配置。任务进度以行为校验结果为准。</p>`;}
function metricUnit(){return ({count:'次',days:'天',continuous:'天',weekly:'周'}[currentGame().rules.mode]);}
function cycleLabel(c){return ({day:'每日任务',week:'每周任务',once:'活动内一次',activity:'活动内累计'}[c]||c);}
function taskRule(t){if(['browse','pool','feed'].includes(t.type))return `有效浏览 ≥ ${t.seconds} 秒`;if(t.type==='publish')return `正文 ≥ ${t.minChars} 字${t.minImages?',图片 ≥ '+t.minImages+' 张':''}`;if(t.type==='comment')return `有效评论 ≥ ${t.minChars} 字`;if(t.type==='invite')return '好友完成有效发观点后计入';if(t.type==='follow')return '同一作者不重复计入';if(t.type==='share')return '分享回执或落地访问校验';return '同一用户、同一内容去重';}
function rewardsView(){const g=currentGame(),r=g.reward;return `<div class="reward-tabs" role="tablist">${[['prizes','奖品与领取方式'],['timing','开放时间与发放']].map(([v,l])=>btn(l,'reward-tab',r.tab===v?'active':'',`data-value="${v}" role="tab" aria-selected="${r.tab===v}"`)).join('')}</div><div class="reward-layout"><div>${r.tab==='prizes'?prizeConfig():timingConfig()}</div>${rewardSummary()}</div>`;}
function prizeConfig(){const g=currentGame(),r=g.reward;return `<div class="config-block"><h2 class="section-title">奖品配置时机</h2>${radio('reward.setup',[['before','提前配置奖品'],['after','先配置资格，后补充奖品']])}${r.setup==='after'?'<div class="help-banner neutral">奖品未补齐前不开放领取。用户可先完成任务，页面显示「已完成，待开放领奖」。</div>':''}</div><div class="config-block"><h2 class="section-title">领取方式</h2><div class="option-cards">${[['direct','直接领取','领取对应档位的单个奖品','P0'],['draw','直接抽奖','从奖池多个奖品中抽一个','P1'],['rush','定时限量开抢','达标后在开放时段抢库存','P1']].map(([v,l,n,p])=>`<label class="option-card ${r.method===v?'active':''}"><strong><input type="radio" name="reward.method" data-cfg="reward.method" value="${v}" ${r.method===v?'checked':''} ${g.type==='lottery'&&v!=='draw'?'disabled':''}>${l} <span class="pill">${p}</span></strong><small>${n}</small></label>`).join('')}</div>${g.type==='lottery'?'<div class="field-note">抽奖玩法使用奖池；阶梯玩法可配置直接领取、达标抽奖或限量开抢。</div>':''}</div><div class="config-block"><div class="row between"><h2 class="section-title">${r.method==='draw'?'抽奖奖池':'阶梯奖励'}</h2>${r.method==='draw'?btn('+ 添加奖品','add-prize','small'):''}</div>${r.method==='draw'?poolTable():tierRewardTable()}${r.method!=='draw'?`<div class="row wrap" style="margin-top:15px"><span class="field-label no-margin">多档奖励</span>${radio('reward.overlap',[['each','各档奖励可分别领取'],['highest','仅领取达成的最高档']])}</div>`:''}</div>${r.method==='rush'?rushConfig():''}<div class="config-block"><h2 class="section-title">领奖限制</h2><div class="basic-grid">${field('每人每档 / 每场次限领',`<div class="inline-field">${ci('reward.claimLimit','number','min="1"')}<span>份</span></div>`)}${field('领奖截止时间',ci('reward.claimEnd','datetime-local'),'',true)}</div></div>`;}
function rewardTypeOptions(v){return options([['cash','现金红包'],['physical','实物奖品'],['virtual','虚拟权益']],v);}
function tierRewardTable(){const g=currentGame();return `<div class="data-wrap"><table class="data-table"><thead><tr><th>达标条件</th><th>奖励类型</th><th>奖品名称</th><th>金额 / 份</th><th>总库存</th></tr></thead><tbody>${g.tiers.map((t,i)=>`<tr><td style="white-space:nowrap">${t.threshold} ${metricUnit()}</td><td><select aria-label="第${i+1}档奖励类型" data-tier="${i}" data-key="rewardType">${rewardTypeOptions(t.rewardType)}</select></td><td><input aria-label="第${i+1}档奖品名称" type="text" data-tier="${i}" data-key="name" value="${esc(t.name)}"></td><td>${t.rewardType==='cash'?`<div class="field-unit"><input aria-label="第${i+1}档金额" type="number" min="0.01" step="0.01" data-tier="${i}" data-key="amount" value="${t.amount}"><em>元</em></div>`:'—'}</td><td style="width:95px"><input aria-label="第${i+1}档库存" type="number" min="1" data-tier="${i}" data-key="stock" value="${t.stock}"></td></tr>`).join('')}</tbody></table></div>`;}
function poolTable(){const g=currentGame(),sum=g.prizes.reduce((s,p)=>s+Number(p.prob),0);return `<div class="data-wrap"><table class="data-table"><thead><tr><th>奖品名称</th><th>类型</th><th>金额(元)</th><th>库存</th><th>概率(%)</th><th>操作</th></tr></thead><tbody>${g.prizes.map((p,i)=>`<tr><td><input aria-label="奖品${i+1}名称" type="text" data-prize="${i}" data-key="name" value="${esc(p.name)}"></td><td><select aria-label="奖品${i+1}类型" data-prize="${i}" data-key="type">${rewardTypeOptions(p.type)}</select></td><td>${p.type==='cash'?`<input aria-label="奖品${i+1}金额" type="number" min="0.01" step="0.01" data-prize="${i}" data-key="amount" value="${p.amount}">`:'—'}</td><td><input aria-label="奖品${i+1}库存" type="number" min="0" data-prize="${i}" data-key="stock" value="${p.stock}"></td><td><input aria-label="奖品${i+1}概率" type="number" min="0" max="100" step="0.1" data-prize="${i}" data-key="prob" value="${p.prob}"></td><td>${btn('配置','prize-advanced','link',`data-index="${i}"`)}${btn('移除','delete-prize','link danger',`data-index="${i}"`)}</td></tr>`).join('')}<tr><td colspan="4">未中奖</td><td colspan="2" class="total-prob ${sum>100?'error':''}">${Math.max(0,100-sum).toFixed(1)}%</td></tr></tbody></table></div><div class="table-bottom"><span class="total-prob ${sum>100?'error':''}">奖品概率合计 ${sum.toFixed(1)}%${sum>100?' · 请调整至不超过100%':''}</span><span class="spacer"></span>剩余概率为未中奖</div><div class="field-note">奖品抽空后转为未中奖；抽奖次数、每人中奖上限在「任务行为选择」中配置。</div>`;}
function rushConfig(){const g=currentGame();return `<div class="config-block"><div class="row between"><h2 class="section-title">开放场次与库存</h2>${btn('+ 添加场次','add-slot','small')}</div><div class="field-note" style="margin-bottom:10px">一场为固定数量定时开抢；多场按时段独立投放库存，单场库存不超过该档总库存。</div><table class="data-table"><thead><tr><th>场次</th><th>开放时间</th><th>每档场次库存</th><th></th></tr></thead><tbody>${g.reward.slots.map((s,i)=>`<tr><td>第${i+1}场</td><td><input aria-label="第${i+1}场时间" type="datetime-local" data-slot="${i}" data-key="time" value="${s.time}"></td><td><input aria-label="第${i+1}场库存" type="number" data-slot="${i}" data-key="stock" value="${s.stock}" min="1"></td><td>${btn('删除','delete-slot','link danger',`data-index="${i}" ${g.reward.slots.length===1?'disabled':''}`)}</td></tr>`).join('')}</tbody></table></div>`;}
function timingConfig(){const g=currentGame(),r=g.reward;return `<div class="config-block"><h2 class="section-title">领奖开放时间</h2>${r.method==='rush'?'<div class="help-banner">按「奖品与领取方式」中配置的场次开放，任务完成仅获得参与资格。</div>':radio('reward.timing',[['now','任务达标后立即可领'],['later','定时开放领取']])}${r.method!=='rush'&&r.timing==='later'?`<div class="basic-grid" style="margin-top:18px">${field('开放方式',cs('reward.schedule',[['weekly','每周固定时间'],['fixed','指定时间点']]))}${r.schedule==='weekly'?field('开放时间',`<div class="row">${cs('reward.weekday',[['1','每周一'],['2','每周二'],['3','每周三'],['4','每周四'],['5','每周五'],['6','每周六'],['0','每周日']])}${ci('reward.openTime','time')}</div>`,'统计上周已完成任务的用户，开放本期领取'):field('开放时间',ci('reward.openAt','datetime-local'))}</div>`:''}<div class="state-example">页面状态：${r.method==='rush'?'已完成，待开抢 → 可参与抢领 → 已领取 / 已抢完':r.timing==='now'?'已完成，可领奖 → 用户主动领取 → 待发放 / 已到账':'已完成，待开放领奖 → 可领奖 → 用户主动领取 → 待发放 / 已到账'}</div></div><div class="config-block"><h2 class="section-title">领奖提醒</h2>${checkbox('reward.reminder','开放领取后，通过消息中心发送领奖提醒')}${r.reminder?`<div style="margin-top:12px"><textarea data-cfg="reward.reminderText" aria-label="提醒文案">${esc(r.reminderText)}</textarea><div class="field-note">提醒点击后回到活动对应领奖区，用户仍需主动抽奖或领取。</div></div>`:''}</div><div class="config-block"><h2 class="section-title">现金发放</h2><div class="basic-grid">${field('到账账户',cs('reward.cashAccount',['九方APP个人账户','已绑定的现金账户']))}${field('发放方式',cs('reward.cashMode',[['batch','按批次结算后发放'],['review','人工审核后发放']]))}${field('结算说明',ci('reward.cashBatch'),'用户领取后显示待发放；实际发放成功后更新已到账',false,true)}</div></div><div class="config-block"><h2 class="section-title">实物履约</h2>${checkbox('reward.address','中奖 / 领取后填写收件人、手机号、收货地址')}${r.address?`<div class="basic-grid" style="margin-top:12px">${field('地址填写截止',ci('reward.addressDeadline','datetime-local'))}${field('物流状态',`<div class="fake-input">待填写地址 → 待发货 → 已发货</div>`)}</div>`:''}</div>`;}
function rewardSummary(){const g=currentGame(),r=g.reward;const method={direct:'领取对应奖品',draw:'主动抽奖',rush:'到点抢领奖品'}[r.method];const timing=r.method==='rush'?'按配置场次开放':r.timing==='now'?'达标后立即开放':r.schedule==='weekly'?`每周${'日一二三四五六'[Number(r.weekday)]} ${r.openTime} 开放`:`${displayTime(r.openAt)} 开放`;return `<aside class="reward-summary"><h3>领取流程预览</h3><div class="summary-line">用户完成社区任务<span>页面更新任务进度与完成状态</span></div><div class="summary-line">${timing}<span>${r.setup==='after'?'需先补齐奖品配置':'按已配置奖品开放资格'}</span></div><div class="summary-line">${r.reminder?'消息中心提醒领奖':'用户回到活动页'}<span>进入活动对应领奖区域</span></div><div class="summary-line">用户${method}<span>任务完成不等于奖品已发放</span></div><div class="summary-line">奖励发放 / 履约<span>现金：待发放 → 已到账<br>实物：填地址 → 待发货 → 已发货</span></div></aside>`;}

function builderView(){const p=currentPage();return `<main class="builder-container"><div class="builder-toolbar"><div class="toolbar-field"><span>页面类型</span><select aria-label="页面类型"><option>H5页面</option></select></div><div class="toolbar-field platform"><span>应用平台</span><select aria-label="应用平台" data-page="platform">${options(['九方擒龙APP','九方智投APP'],p.platform||'九方擒龙APP')}</select></div><select class="device-select" data-ui="device" aria-label="画布尺寸">${options([['375','默认（375*667）'],['390','iPhone（390*844）'],['414','大屏（414*896）']],state.device)}</select><span class="spacer"></span>${btn('新增','new-page','primary')}${btn(state.preview?'退出预览':'预览','preview-canvas','link')}${btn('保存','save-page','', 'style="border-color:#3885ff;color:#1976ff"')}${btn('下一步','check-page','primary')}</div><div class="builder-main ${state.preview?'preview-mode':''}"><aside class="library"><div class="pane-head">页面${btn('+','new-page','icon-btn ghost','aria-label="新增页面"')}</div><div class="page-list">${state.pages.map((x,i)=>`<button class="page-item ${state.pageIndex===i?'active':''}" data-act="switch-page" data-index="${i}"><span>${esc(x.name)}</span><span class="spacer"></span><span>···</span></button>`).join('')}</div><div class="library-tabs">${btn('组件','library-tab',state.libraryTab==='components'?'active':'','data-value="components"')}${btn('图层','library-tab',state.libraryTab==='layers'?'active':'','data-value="layers"')}</div>${state.libraryTab==='components'?componentLibrary():layerList()}</aside><div class="canvas-stage" id="canvas-stage"><div class="canvas-ruler"><span>${state.preview?'页面预览 · 示例进度':state.device+' px · 页面画布'}</span><div class="row"><span class="save-hint">${p.savedAt?'已保存 '+p.savedAt:'未保存'}</span><select aria-label="画布缩放" data-ui="zoom">${options(['75','85','100'],state.zoom).replace(/>(75|85|100)</g,'>$1%<')}</select></div></div><div class="canvas-label">${state.preview?'PREVIEW':'H5 PAGE'}</div><div class="canvas-shell" style="width:${state.device}px;${state.zoom!=='100'?`transform:scale(${Number(state.zoom)/100});margin-bottom:-${(1-Number(state.zoom)/100)*800}px`:''}"><div class="phone-canvas" id="phone-canvas" style="width:${state.device}px;background:${esc(p.background)}">${renderCanvas()}</div></div><div class="canvas-bottom">${state.preview?'预览用于检查展示，不触发真实任务与发奖':'点击组件编辑属性 · 拖动组件可调整顺序'}</div></div><aside class="editor-props" id="editor-props"><div class="props-title"><span>编辑栏</span><span class="page-id">页面ID：${p.id}</span></div><div class="props-content">${propsView()}</div></aside></div></main>`;}
function componentLibrary(){return `${libraryGroup('任务玩法',['ladder','lottery','tasks'],true)}${libraryGroup('任务拆分组件',['taskButton','taskProgress','taskValue'])}${libraryGroup('图片',['image','banner','bottom','popup','float'])}${libraryGroup('活动通用',['hero','prizes','rules'])}${libraryGroup('视频',['video'])}<div class="component-hint">点击或拖动组件到画布</div>`;}
function libraryGroup(title,types,isNew=false){return `<div class="library-section"><div class="library-title">${title}<span class="muted">⌃</span></div><div class="component-grid">${types.map(t=>`<button class="component-tile" data-act="add-component" data-type="${t}" draggable="true" data-drag-type="${t}"><span class="component-thumb">${ico(({hero:'banner',tasks:'list',prizes:'gift',rules:'page'}[t]||t))}${isNew?'<span class="new-dot">新增</span>':''}</span><span>${cNames[t]}</span></button>`).join('')}</div></div>`;}
function layerList(){return `<div class="layer-list">${currentPage().components.map((c,i)=>`<button class="layer-item ${c.id===state.selected?'active':''}" data-act="select-component" data-id="${c.id}" draggable="true" data-drag-id="${c.id}"><span class="index">${String(i+1).padStart(2,'0')}</span>${ico(({tasks:'list',hero:'banner',prizes:'gift',rules:'page'}[c.type]||c.type))}<span>${cNames[c.type]}</span><span class="spacer"></span>${!c.visible?'隐':''}</button>`).join('')}</div>`;}
function renderCanvas(){const p=currentPage();return p.components.map(c=>`<section role="button" tabindex="0" aria-label="编辑${cNames[c.type]}" class="canvas-item ${state.selected===c.id?'selected':''} ${!c.visible?'hidden-component':''}" data-act="select-component" data-id="${c.id}" data-label="${cNames[c.type]}" draggable="${!state.preview}" data-drag-id="${c.id}" style="--accent:${esc(c.accent)};--radius:${c.radius}px;--space:${c.padding}px">${btn('×','remove-component','remove-handle',`data-id="${c.id}" aria-label="删除${cNames[c.type]}"`)}${phoneContent(c)}</section>`).join('')||'<div class="canvas-empty">将左侧组件拖入此处<br>或点击组件添加到页面</div>';}
function phoneContent(c){const g=state.games[c.bind]||state.games.ladder;if(['taskButton','taskProgress','taskValue'].includes(c.type))return familyContent(c,g);if(c.type==='hero'&&c.image)return `<img alt="活动头图" src="${esc(c.image)}" style="width:100%;display:block">`;if(c.type==='hero')return `<div class="preview-hero" style="background:linear-gradient(125deg,${esc(c.accent)},#5595fa)"><div class="hero-brand">九方社区 · 创作者计划</div><div class="hero-kicker">每一个好观点，都值得被看见</div><h2>${esc(c.title)}</h2><p>${esc(c.subtitle)}</p><div class="hero-badge">${g.start.slice(5,10).replace('-','.')} — ${g.end.slice(5,10).replace('-','.')} · 限时参与</div><div class="hero-orbit"></div></div>`;
if(c.type==='ladder'&&c.layout==='cards')return ladderCards(c,g);if(c.type==='ladder')return `<div class="phone-section"><div class="phone-title">${esc(c.title)}<span class="phone-tag">累计任务</span></div>${c.showCaption?`<div class="phone-caption">${esc(c.subtitle)}</div>`:''}<div class="ladder-track">${g.tiers.map(t=>`<div class="ladder-milestone"><div class="reward-coin">${t.rewardType==='cash'?'¥'+t.amount:ico('gift')}</div><div>${esc(t.name)}</div><div class="milestone-count">${t.threshold} ${({count:'次',days:'天',continuous:'天',weekly:'周'}[g.rules.mode])}</div><span class="phone-small-btn">未达成</span>${c.showStock?`<div style="font-size:8px;margin-top:7px;color:#abb6c5">${t.stock}份</div>`:''}</div>`).join('')}</div>${c.showProgress?'<div class="phone-caption" style="text-align:center;margin-top:15px">当前进度 0 · 完成后解锁领取资格</div>':''}</div>`;
if(c.type==='lottery')return `<div class="phone-section"><div class="phone-title">${esc(c.title)}</div>${c.showCaption?`<div class="phone-caption">${esc(c.subtitle)}</div>`:''}${c.layout==='wheel'?'<div class="phone-wheel"><div class="mini-wheel"></div></div>':c.layout==='scratch'?'<div class="phone-scratch">刮开领取惊喜</div>':`<div class="phone-prizes">${g.prizes.slice(0,3).map(p=>`<div class="phone-prize"><div class="prize-visual ${p.type==='cash'?'cash':''}">${p.type==='cash'?'¥'+p.amount:ico('gift')}</div>${esc(p.name)}</div>`).join('')}</div>`}<div class="phone-draw-btn">${esc(c.button)}</div>${c.showTen?'<div class="phone-small-btn" style="margin-top:8px;display:flex">十连抽</div>':''}<div class="phone-chances">剩余 0 次抽奖机会</div>${c.showWinners?'<div class="phone-caption" style="text-align:center;margin-top:12px">中奖名单 · 暂无中奖记录</div>':''}${c.showRules?'<div class="phone-prize-link" style="margin-top:10px">我的奖品 <span>·</span> 抽奖规则</div>':''}</div>`;
if(c.type==='tasks'){const ts=(c.taskIds.length?c.taskIds.map(id=>g.tasks.find(t=>t.id===id)).filter(Boolean):g.tasks).filter(t=>t.enabled);return `<div class="phone-section ${c.layout==='compact'?'phone-list-compact':''}"><div class="phone-title">${esc(c.title)}</div>${c.layout==='popup'?'<div class="phone-caption">点击「做任务」后，以弹层展示任务列表</div>':''}${ts.map(t=>{const ds=c.taskDisplay?.[t.id]||{};return `<div class="phone-task"><div class="phone-task-icon">${ico(actionIcon(t.type))}</div><div><div class="phone-task-title">${esc(ds.title||t.name)}${c.showProgress?`<span class="phone-task-progress">0/${t.goal}</span>`:''}</div><div class="phone-task-desc">${esc(ds.description||taskRule(t))}${g.type==='lottery'?'<br>抽奖机会 +'+t.chance:''}</div></div><span class="phone-cta">${esc(ds.button||t.button)}</span></div>`;}).join('')||'<div class="phone-caption">请在后台添加关联任务</div>'}</div>`;}
if(c.type==='rules')return `<div class="phone-rules"><b>${esc(c.title)}</b>\n${esc(c.rules)}</div>`;
if(c.type==='prizes')return `<div class="phone-prize-link">${ico('gift')} ${esc(c.title)} <span>›</span></div>`;
if(c.type==='bottom')return `<div class="phone-footer">${esc(c.title||'立即参与')}</div>`;
if(c.type==='image'||c.type==='banner')return c.image?`<img alt="运营上传图片" src="${esc(c.image)}" style="width:100%;display:block">`:`<div class="phone-image" style="height:${c.type==='banner'?80:130}px">${ico('image')}　点击右侧上传图片</div>`;
if(c.type==='popup')return `<div class="phone-section"><div class="phone-title">${esc(c.title)}</div><div class="phone-caption">弹窗组件 · 触发时展示</div></div>`;
if(c.type==='float')return `<div style="display:flex;justify-content:flex-end;padding:8px"><span class="phone-cta">${esc(c.title)}</span></div>`;
return `<div class="phone-image" style="height:180px">${ico('video')}　视频组件 · 待配置素材</div>`;}
function propField(label,control,note='',req=false){return `<div class="prop-field"><label class="${req?'required':''}">${label}</label><div>${control}${note?`<div class="field-note">${note}</div>`:''}</div></div>`;}
const pi=(key,type='text',extra='')=>`<input type="${type}" data-prop="${key}" value="${esc(selectedComponent()?.[key])}" ${extra}>`;
const ps=(key,list)=>`<select data-prop="${key}">${options(list,selectedComponent()?.[key])}</select>`;
const pc=(key,label)=>`<label class="prop-check"><input type="checkbox" data-prop="${key}" ${selectedComponent()?.[key]?'checked':''}>${label}</label>`;
function propsView(){const c=selectedComponent();if(!c)return '<div class="empty-props">选择画布中的组件<br>在这里编辑内容与样式</div>';const g=state.games[c.bind];return `<div class="selected-component">${ico(({tasks:'list',hero:'banner',rules:'page',prizes:'gift'}[c.type]||c.type))}<div><strong>${cNames[c.type]}</strong><small>组件ID：${c.id.slice(-12)}</small></div><span class="spacer"></span><span class="pill blue">已选中</span></div><div class="property-tabs">${btn('组件配置','property-tab',state.propertyTab==='config'?'active':'','data-value="config"')}${btn('样式设置','property-tab',state.propertyTab==='style'?'active':'','data-value="style"')}</div>${state.propertyTab==='config'?`<div class="prop-group"><h3>基础信息</h3>${propField('组件标题',pi('title'),'',true)}${['hero','ladder','lottery'].includes(c.type)?propField('副标题',pi('subtitle')):''}${propField('是否展示',pc('visible','展示该组件'))}</div>${['ladder','lottery','tasks','taskButton','taskProgress','taskValue'].includes(c.type)?`<div class="prop-group"><h3>关联玩法</h3>${propField('玩法名称',ps('bind',Object.entries(state.games).filter(([k])=>['tasks','taskButton','taskProgress','taskValue'].includes(c.type)||k===c.type).map(([k,x])=>[k,x.name+(x.saved?'':'（草稿）')])),'选择已配置的后台玩法',true)}<div class="binding-info"><b>${g.id}</b><br>${gameLabel(c.bind)} · ${g.saved?'已保存':'未保存草稿'}<br>${g.tasks.length} 个任务 · ${c.bind==='ladder'?g.tiers.length+'档奖励':g.prizes.length+'种奖品'}<br>${displayTime(g.start).slice(0,10)} 至 ${displayTime(g.end).slice(0,10)}</div><div style="text-align:right;margin-top:6px">${btn(c.type==='lottery'?'抽奖中心':'任务中心',c.type==='lottery'?'pool-center':'task-center','link small')}${btn('查看 / 编辑玩法 →','edit-bound-game','link small',`data-kind="${c.bind}"`)}</div></div>`:''}${componentProps(c,g)}`:`<div class="prop-group"><h3>颜色与布局</h3>${propField('主题颜色',`<div class="row">${pi('accent','color')}${pi('accent','text','aria-label="主题颜色值"')}</div>`)}${propField('组件圆角',`<div class="row">${pi('radius','number','min="0" max="24"')}<span class="muted">px</span></div>`)}${propField('外边距',`<div class="row">${pi('padding','number','min="0" max="30"')}<span class="muted">px</span></div>`)}${propField('页面背景',`<input type="color" data-page="background" value="${currentPage().background}">`)}</div>`}<div class="prop-group"><h3>组件操作</h3><div class="component-tools">${btn('↑ 上移','move-component','','data-direction="-1"')}${btn('↓ 下移','move-component','','data-direction="1"')}${btn('复制','copy-component')}${btn('删除','remove-component','danger',`data-id="${c.id}"`)}</div></div><div class="prop-hint">${['ladder','lottery','tasks'].includes(c.type)?'任务达标、奖品库存与开放时间由关联玩法控制；此处配置前端展示。':'编辑后直接更新画布，保存页面保留当前配置。'}</div>`;}
function componentProps(c,g){if(['taskButton','taskProgress','taskValue'].includes(c.type))return familyProps(c,g);if(c.type==='tasks')return `<div class="prop-group"><h3>列表配置</h3>${propField('展示形式',ps('layout',[['embedded','页面内嵌'],['compact','紧凑列表'],['popup','任务弹层']]))}${pc('showProgress','显示任务完成进度')}<div class="small-header">展示任务与排序</div>${(c.taskIds.length?[...c.taskIds.map(id=>g.tasks.find(t=>t.id===id)).filter(Boolean),...g.tasks.filter(t=>!c.taskIds.includes(t.id))]:g.tasks).map(t=>`<div class="prop-task"><label><input type="checkbox" data-task-visible="${t.id}" ${!c.taskIds.length||c.taskIds.includes(t.id)?'checked':''}>${esc(t.name)}</label>${btn('配置','display-task','link small',`data-id="${t.id}"`)}${btn('↑','task-order','icon-btn ghost',`data-id="${t.id}" data-direction="-1" aria-label="上移${t.name}"`)}${btn('↓','task-order','icon-btn ghost',`data-id="${t.id}" data-direction="1" aria-label="下移${t.name}"`)}</div>`).join('')}<div class="prop-hint">按钮文案、任务完成条件在关联玩法的任务配置中设置。</div></div>`;
if(c.type==='ladder')return `<div class="prop-group"><h3>阶梯展示</h3>${propField('布局样式',ps('layout',[['embedded','横向阶梯'],['cards','纵向奖励卡片']]))}${pc('showProgress','显示当前累计进度')}${pc('showStock','显示各档奖品库存')}${pc('showCaption','显示玩法说明')}<div class="prop-stat"><span>门槛与奖励</span><span>跟随关联玩法</span></div>${g.tiers.map(t=>`<div class="prop-stat"><span>${t.threshold} ${({count:'次',days:'天',continuous:'天',weekly:'周'}[g.rules.mode])}</span><span>${esc(t.name)}</span></div>`).join('')}</div>`;
if(c.type==='lottery')return `<div class="prop-group"><h3>抽奖展示</h3>${propField('抽奖样式',ps('layout',[['direct','直接抽奖'],['wheel','大转盘'],['scratch','刮刮乐']]))}${propField('按钮文案',pi('button'))}${pc('showCaption','显示玩法说明')}${pc('showRules','显示我的奖品 / 规则入口')}${pc('showTen','显示十连抽按钮')}${pc('showWinners','显示中奖名单')}<div class="prop-hint">不同样式共用同一奖池与抽奖概率。</div></div>`;
if(c.type==='rules')return `<div class="prop-group"><h3>规则内容</h3><textarea rows="9" data-prop="rules" aria-label="活动规则">${esc(c.rules)}</textarea></div>`;
if(['image','banner','hero'].includes(c.type))return `<div class="prop-group"><h3>图片素材</h3><div class="prop-field"><label class="required">上传图片</label><div><label class="upload-zone" for="image-upload">${c.image?'<span>已上传 · 点击更换</span>':ico('image')+'<span>点击上传图片</span>'}</label><input id="image-upload" type="file" accept="image/png,image/jpeg,image/webp" data-upload="image" hidden><div class="prop-hint">PNG / JPG / WebP，最大2MB</div>${c.image?btn('移除图片','remove-image','link small'):''}</div></div>${c.type==='hero'?'<div class="prop-hint">未上传时使用当前文字主题头图；上传后替换为图片。</div>':''}</div>`;
if(['bottom','float','popup','prizes'].includes(c.type))return `<div class="prop-group"><h3>动作配置</h3>${propField('触发条件',`<select data-prop="trigger">${options(['点击事件','页面进入'],c.trigger||'点击事件')}</select>`)}${propField('跳转类型',`<select data-prop="jumpType">${options(['页面锚点','APP原生页','H5链接'],c.jumpType||'页面锚点')}</select>`)}${propField('跳转目标',`<input type="text" data-prop="jumpTarget" value="${esc(c.jumpTarget||'任务列表')}" placeholder="页面锚点或跳转地址">`)}</div>`;
return `<div class="prop-group"><h3>视频配置</h3>${propField('视频地址',`<input type="url" data-prop="video" value="${esc(c.video||'')}" placeholder="https://...">`)}</div>`;}

function render(){enrich();const canvasScroll=document.getElementById('canvas-stage')?.scrollTop||0;const propScroll=document.getElementById('editor-props')?.scrollTop||0;app.innerHTML=shell();if(document.getElementById('canvas-stage'))document.getElementById('canvas-stage').scrollTop=canvasScroll;if(document.getElementById('editor-props'))document.getElementById('editor-props').scrollTop=propScroll;renderModal();notifyHeight();}
function renderCanvasOnly(){const el=document.getElementById('phone-canvas');if(el)el.innerHTML=renderCanvas();}
function notifyHeight(){try{window.parent.postMessage({type:'jiufang-prototype-height',height:Math.max(850,document.documentElement.scrollHeight)},'*');}catch{}}
function formValidate(all=false){const g=currentGame();const n=[];const step=all?99:state.step;if(step>=1){if(!g.name.trim())n.push('请填写玩法名称');if(!g.activity.trim())n.push('请填写关联活动');if(!g.start||!g.end||g.start>=g.end)n.push('活动结束时间必须晚于开始时间');if(g.gray<0||g.gray>100)n.push('灰度比例需在0—100%之间');if(g.audience==='segment'&&!g.audienceName.trim())n.push('请选择投放人群包');if(g.audience==='whitelist'&&!g.whitelist.trim())n.push('请填写白名单用户ID');}if(step>=2){if(!g.tasks.length)n.push('请至少关联一个社区任务');if(g.type==='ladder'){if(!g.tasks.some(t=>t.id===g.rules.mainTask))n.push('请选择有效的阶梯主任务');if(g.tiers.some((t,i)=>Number(t.threshold)<=0||(i>0&&Number(t.threshold)<=Number(g.tiers[i-1].threshold))))n.push('阶梯门槛必须为正数，且逐档递增');}if(g.tasks.some(t=>t.start<g.start||t.end>g.end||t.start>=t.end))n.push('任务生效时间必须在玩法有效期内，避免完成后未获得机会');if(g.tasks.some(t=>t.goal<1||t.limit<1||t.chance<1))n.push('任务完成次数与奖励次数需大于0');}if(step>=3){const r=g.reward;if(r.overlap==='highest'&&r.timing==='now')n.push('最高档奖励需在周期结束后结算，请选择定时开放领取');if(r.method==='draw'){if(!g.prizes.length)n.push('请至少配置一个奖品');if(g.prizes.reduce((s,p)=>s+Number(p.prob),0)>100)n.push('奖品概率合计不能超过100%');if(g.prizes.some(p=>p.prob<0||p.stock<0))n.push('奖品概率与库存不可为负数');}if(r.setup==='before'){const list=r.method==='draw'?g.prizes:g.tiers;if(list.some(p=>!p.name.trim()||p.stock<=0))n.push('请补齐奖品名称与库存');if(list.some(p=>(p.type||p.rewardType)==='cash'&&p.amount<=0))n.push('现金金额需大于0');}if(!r.claimEnd||r.claimEnd<=g.start)n.push('领奖截止时间必须晚于活动开始');if(r.method==='rush'){if(r.slots.some(s=>s.stock<=0||!s.time||s.time>r.claimEnd))n.push('开抢场次需有有效时间、库存，且早于领奖截止');const total=r.slots.reduce((s,p)=>s+Number(p.stock),0);if(g.tiers.some(t=>total>t.stock))n.push('开抢各场次库存合计不可超过任一档奖品总库存');}if(r.timing==='later'&&r.schedule==='fixed'&&r.openAt>=r.claimEnd)n.push('领奖截止时间必须晚于开放时间');}return n;}
function saveGame(navigate=false){const problems=formValidate(true);if(problems.length){error=problems.join('；');render();toast('请先修正配置中的问题',true);return false;}const g=currentGame();g.saved=true;g.savedAt=now();persist();error='';if(navigate)goBuilder();else render();toast('玩法已保存为本地草稿，可在搭建页关联');return true;}
function goBuilder(){state.workspace='builder';state.pageIndex=state.pages.findIndex(p=>p.kind===state.kind);if(state.pageIndex<0)state.pageIndex=0;state.selected=currentPage().components.find(c=>c.type===state.kind)?.id||currentPage().components[0]?.id;state.propertyTab='config';state.preview=false;error='';render();}
function openTask(id){editTaskId=id;tempTask=clone(currentGame().tasks.find(t=>t.id===id));modal='task';renderModal();}
function modalShell(title,body,footer,cls=''){return `<div class="modal-mask"><section class="modal ${cls}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><header class="modal-header">${title}<span class="spacer"></span>${btn(ico('close'),'close-modal','icon-btn ghost','aria-label="关闭"')}</header><div class="modal-body">${body}</div><footer class="modal-footer">${footer}</footer></section></div>`;}
function renderModal(){if(!modal){overlays.innerHTML='';return;}if(renderSopModal())return;if(modal==='add-tasks'){overlays.innerHTML=modalShell('添加社区任务',`<div class="help-banner neutral" style="margin-bottom:18px">所有行为类型均支持；可按活动目标自由组合，不因玩法类型删减。</div><div class="behavior-grid">${Object.entries(actionNames).map(([k,l])=>`<label class="behavior-choice ${selectedActions.has(k)?'checked':''}"><span class="behavior-icon">${ico(actionIcon(k))}</span><span><strong>${l}</strong><small>${actionNotes[k]}</small></span><input type="checkbox" data-select-action="${k}" ${selectedActions.has(k)?'checked':''}></label>`).join('')}</div>`,btn('取消','close-modal')+btn(`添加 ${selectedActions.size} 项任务`,'confirm-tasks','primary'));return;}
if(modal==='task'){const t=tempTask;const ti=(key,type='text',extra='')=>`<input type="${type}" data-temp="${key}" value="${esc(t[key])}" ${extra}>`;const ts=(key,items)=>`<select data-temp="${key}">${options(items,t[key])}</select>`;overlays.innerHTML=modalShell('配置任务 · '+actionNames[t.type],`<div class="basic-grid">${taskExtraFields(t)}${field('任务名称',ti('name'),'',true)}${field('按钮文案',ti('button'))}${field('关联范围',ts('target',t.type==='publish'?['社区全部观点','指定话题']:t.type==='follow'?['指定作者池','指定作者']:t.type==='pool'?['优质观点池']:t.type==='feed'?['指定社区帖子流']:t.type==='invite'?['受邀好友首次发观点','受邀好友发指定话题观点']:['指定内容','指定内容池']))}${field('目标内容 / 人群',ti('targetValue'),'输入内容ID、作者ID、内容池或话题名称')}${field('任务周期',ts('cycle',[['day','每日'],['week','每周'],['once','活动内一次'],['activity','活动内累计']]))}${field('每周期完成上限',ti('limit','number','min="1"'))}${field('完成任务需要',`<div class="inline-field">${ti('goal','number','min="1"')}<span>次有效行为</span></div>`)}${state.kind==='lottery'?field('完成后增加抽奖机会',ti('chance','number','min="1"')):field('计入方式','<div class="fake-input">按有效行为结果计入任务进度</div>')}${['browse','feed','pool'].includes(t.type)?field('有效浏览时长',`<div class="inline-field">${ti('seconds','number','min="1"')}<span>秒</span></div>`,'需处于前台且内容实际可见，返回活动后更新进度',true):''}${['publish','comment'].includes(t.type)?field('正文最少字数',ti('minChars','number','min="1"')):''}${t.type==='publish'?field('最少图片数量',ti('minImages','number','min="0"')):''}${t.type==='publish'?field('关联话题',ti('topic')):''}${['publish','comment'].includes(t.type)?field('审核口径',ts('audit',[['approved','审核通过后计入'],['published','不以审核状态计数']])):''}${taskLevelFields(t)}${t.type==='invite'?'<div class="wide help-banner neutral">通过邀请链接关联邀请关系；好友完成有效发观点后，邀请人才获得任务进度。同一好友不可重复计入。</div>':''}${t.type==='follow'?'<div class="wide help-banner neutral">已关注作者不重复计数；取消后重新关注同一作者，不再次增加进度。</div>':''}${t.type==='share'?'<div class="wide help-banner neutral">点击分享按钮不直接计为完成，需分享回执或可核验的落地访问。</div>':''}</div>`,btn('取消','close-modal')+btn('保存任务','save-task','primary'));return;}
if(modal==='new-page'){overlays.innerHTML=modalShell('新增运营页面',`<div class="basic-grid"><label class="field wide"><span class="required">页面名称</span><input id="new-page-name" type="text" value="新的社区活动"></label><label class="field wide"><span>初始化模板</span><select id="new-page-kind"><option value="ladder">阶梯任务页面</option><option value="lottery">抽奖任务页面</option><option value="empty">空白页面</option></select></label></div>`,btn('取消','close-modal')+btn('创建页面','confirm-page','primary'));return;}
if(modal==='check-page'){const p=currentPage(),checks=pageChecks();overlays.innerHTML=modalShell('页面检查',`<div class="review-meta"><span>页面：<b>${esc(p.name)}</b></span><span>页面ID：${p.id}</span><span>组件：${p.components.length} 个</span><span>应用平台：${esc(p.platform||'九方擒龙APP')}</span></div><ul class="validation-list">${checks.map(x=>`<li><span class="${x.ok?'validation-good':'validation-bad'}">${x.ok?'✓':'!'}</span><span><strong>${esc(x.title)}</strong><small>${esc(x.note)}</small></span></li>`).join('')}</ul><div class="publish-note">当前为本地交互原型。保存后保留草稿，不上传飞书、不发布活动，也不会产生真实任务、抽奖或现金发放。</div>`,btn('返回编辑','close-modal')+btn('保存检查结果','save-checked','primary'));return;}
}
function pageChecks(){const p=currentPage();const bound=[...new Set(p.components.filter(c=>['ladder','lottery','tasks'].includes(c.type)).map(c=>c.bind))];const stale=p.components.some(c=>{const g=state.games[c.bind];return g&&((c.taskIds?.some(id=>!g.tasks.some(t=>t.id===id)))||(['taskButton','taskProgress','taskValue'].includes(c.type)&&!g.tasks.some(t=>t.id===c.taskId)));});return [{ok:!stale,title:'任务引用有效',note:stale?'存在已删除任务，请重新绑定':'按唯一ID关联，未发现失效任务'},{ok:p.components.length>0,title:'页面包含可展示组件',note:p.components.length+'个组件，'+p.components.filter(c=>c.visible).length+'个展示中'},{ok:bound.length>0&&bound.every(k=>state.games[k]?.saved),title:'关联玩法已保存',note:bound.map(k=>state.games[k].name+'：'+(state.games[k].saved?'已保存':'需先保存玩法')).join('；')||'请添加阶梯或抽奖组件'},{ok:p.components.some(c=>c.type==='tasks'&&c.visible),title:'任务列表承接',note:'用户可通过任务列表了解完成要求并跳转到社区行为'},{ok:bound.every(k=>!formValidateGame(k).length),title:'玩法规则与奖品配置',note:bound.some(k=>formValidateGame(k).length)?'存在未完成的配置，请回玩法后台检查':'已检查时间、任务、概率、阶梯门槛与库存'},{ok:p.components.some(c=>c.type==='prizes'&&c.visible),title:'领奖记录入口',note:'通过「我的奖品」查看领取与发放状态'}];}
function formValidateGame(k){const old=state.kind;state.kind=k;const res=formValidate(true);state.kind=old;return res;}
function markDirty(){currentGame().saved=false;error='';}
function markPageDirty(){currentPage().savedAt='';}
function addComponent(type,index){const p=currentPage(),c=component(type,['ladder','lottery'].includes(type)?type:p.kind);if(!state.games[c.bind])c.bind='ladder';if(type==='hero'){c.title=p.name;}if(index===undefined)p.components.push(c);else p.components.splice(index,0,c);state.selected=c.id;state.propertyTab='config';markPageDirty();render();toast('已添加'+cNames[type]);setTimeout(()=>document.querySelector(`.canvas-item[data-id="${c.id}"]`)?.scrollIntoView({block:'nearest',behavior:'smooth'}),20);}
app.addEventListener('click',handleClick);overlays.addEventListener('click',handleClick);
function handleClick(e){const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act,g=currentGame();switch(a){
case 'prize-advanced':prizeIndex=Number(el.dataset.index);tempPrize=clone(g.prizes[prizeIndex]);modal='prize-advanced';renderModal();break;
case 'save-prize-advanced':if(!tempPrize.name.trim()||Number(tempPrize.totalLimit)>Number(tempPrize.stock)||Number(tempPrize.dayLimit)>Number(tempPrize.totalLimit)){toast('请检查名称及库存限制：每日上限 ≤ 活动上限 ≤ 总库存',true);break;}g.prizes[prizeIndex]=clone(tempPrize);markDirty();modal=null;render();toast('奖品配置已更新');break;
case 'inherit-task-time':tempTask.start=g.start;tempTask.end=g.end;renderModal();break;
case 'add-task-level':tempTask.levels.push({threshold:(tempTask.levels.at(-1)?.threshold||0)+1,chance:1});renderModal();break;
case 'remove-task-level':tempTask.levels.splice(Number(el.dataset.index),1);renderModal();break;
case 'display-task':displayTaskId=el.dataset.id;modal='display-task';renderModal();break;
case 'save-display-task':modal=null;markPageDirty();render();toast('任务展示已更新');break;
case 'task-center':modal='task-center';renderModal();break;
case 'center-edit':state.kind=el.dataset.kind;state.workspace='config';state.step=2;modal=null;render();openTask(el.dataset.id);break;
case 'pool-center':modal='pool-center';renderModal();break;
case 'pool-edit':state.workspace='config';state.kind='lottery';state.step=3;state.games.lottery.reward.tab='prizes';modal=null;render();break;
case 'workspace':state.workspace=el.dataset.value;state.preview=false;error='';render();break;
case 'choose-game':state.kind=el.dataset.kind;error='';render();break;
case 'step':state.step=Number(el.dataset.index);error='';render();break;
case 'previous':state.step=Math.max(0,state.step-1);error='';render();break;
case 'next':if(state.step===3){saveGame(true);break;}error=formValidate().join('；');if(!error)state.step++;render();break;
case 'save-draft':g.savedAt=now();persist();render();toast(storageAvailable?'草稿已保存在此浏览器':'草稿已保存至当前原型会话');break;
case 'to-builder':goBuilder();break;
case 'add-tier':g.tiers.push({threshold:(Number(g.tiers.at(-1)?.threshold)||0)+4,rewardType:'cash',name:'20元现金红包',amount:20,stock:500});markDirty();render();break;
case 'delete-tier':g.tiers.splice(Number(el.dataset.index),1);markDirty();render();break;
case 'add-tasks':selectedActions=new Set();modal='add-tasks';renderModal();break;
case 'confirm-tasks':if(!selectedActions.size){toast('请至少选择一种任务行为',true);break;}for(const k of selectedActions)g.tasks.push(task(k));if(!g.rules.mainTask)g.rules.mainTask=g.tasks[0].id;markDirty();modal=null;render();toast('已添加任务，可逐项配置条件');break;
case 'edit-task':openTask(el.dataset.id);break;
case 'delete-task':g.tasks=g.tasks.filter(t=>t.id!==el.dataset.id);if(g.rules.mainTask===el.dataset.id)g.rules.mainTask=g.tasks[0]?.id||'';markDirty();render();break;
case 'save-task':if(!tempTask.name.trim()||tempTask.goal<1||tempTask.limit<1||tempTask.chance<1||tempTask.start>=tempTask.end||(tempTask.hasLevels&&tempTask.levels.some((l,i)=>l.threshold<=0||l.chance<1||(i>0&&l.threshold<=tempTask.levels[i-1].threshold)))){toast('请检查任务名称、起止时间、次数和关卡递增门槛',true);break;}g.tasks[g.tasks.findIndex(t=>t.id===editTaskId)]=clone(tempTask);markDirty();modal=null;render();toast('任务配置已更新');break;
case 'reward-tab':g.reward.tab=el.dataset.value;render();break;
case 'add-prize':g.prizes.push({name:'新奖品',type:'cash',amount:1,stock:100,prob:1});markDirty();render();break;
case 'delete-prize':g.prizes.splice(Number(el.dataset.index),1);markDirty();render();break;
case 'add-slot':g.reward.slots.push({time:'2026-12-02T12:00',stock:100});markDirty();render();break;
case 'delete-slot':g.reward.slots.splice(Number(el.dataset.index),1);markDirty();render();break;
case 'switch-page':state.pageIndex=Number(el.dataset.index);state.selected=currentPage().components.find(c=>['ladder','lottery'].includes(c.type))?.id||currentPage().components[0]?.id;state.preview=false;render();break;
case 'library-tab':state.libraryTab=el.dataset.value;render();break;
case 'property-tab':state.propertyTab=el.dataset.value;render();break;
case 'select-component':state.selected=el.dataset.id;render();break;
case 'add-component':addComponent(el.dataset.type);break;
case 'remove-component':{const p=currentPage();const i=p.components.findIndex(c=>c.id===el.dataset.id);p.components.splice(i,1);state.selected=p.components[Math.min(i,p.components.length-1)]?.id;markPageDirty();render();break;}
case 'move-component':{const p=currentPage(),i=p.components.findIndex(c=>c.id===state.selected),j=i+Number(el.dataset.direction);if(j<0||j>=p.components.length){toast(j<0?'已是第一个组件':'已是最后一个组件');break;}[p.components[i],p.components[j]]=[p.components[j],p.components[i]];markPageDirty();render();break;}
case 'copy-component':{const p=currentPage(),i=p.components.findIndex(c=>c.id===state.selected),c=clone(p.components[i]);c.id=uid();p.components.splice(i+1,0,c);state.selected=c.id;markPageDirty();render();toast('已复制组件');break;}
case 'task-order':{const c=selectedComponent(),gg=state.games[c.bind];if(!c.taskIds.length)c.taskIds=gg.tasks.map(t=>t.id);const i=c.taskIds.indexOf(el.dataset.id),j=i+Number(el.dataset.direction);if(i>=0&&j>=0&&j<c.taskIds.length){[c.taskIds[i],c.taskIds[j]]=[c.taskIds[j],c.taskIds[i]];markPageDirty();render();}break;}
case 'edit-bound-game':state.kind=el.dataset.kind;state.workspace='config';state.step=2;render();break;
case 'preview-canvas':state.preview=!state.preview;render();break;
case 'save-page':currentPage().savedAt=now();persist();render();toast('页面草稿已保存，未上传或发布');break;
case 'new-page':modal='new-page';renderModal();break;
case 'confirm-page':{const name=document.getElementById('new-page-name').value.trim();const kind=document.getElementById('new-page-kind').value;if(!name){toast('请填写页面名称',true);break;}const p=makePage(kind==='empty'?'ladder':kind);p.name=name;p.id=String(Date.now());if(kind==='empty')p.components=[];else p.components[0].title=name;state.pages.push(p);state.pageIndex=state.pages.length-1;state.selected=p.components[0]?.id;modal=null;render();break;}
case 'check-page':modal='check-page';renderModal();break;
case 'save-checked':currentPage().savedAt=now();persist();modal=null;render();toast('本地页面与检查结果已保存，未发布');break;
case 'close-modal':modal=null;renderModal();break;
case 'remove-image':selectedComponent().image='';markPageDirty();render();break;
}}
function handleChange(e){const el=e.target;let value=el.type==='checkbox'?el.checked:el.type==='number'?Number(el.value):el.value;if(el.dataset.prizeTemp){tempPrize[el.dataset.prizeTemp]=value;}
else if(el.dataset.taskDisplay){const c=selectedComponent();c.taskDisplay=c.taskDisplay||{};c.taskDisplay[displayTaskId]=c.taskDisplay[displayTaskId]||{};c.taskDisplay[displayTaskId][el.dataset.taskDisplay]=value;}
else if(el.dataset.level!==undefined){tempTask.levels[Number(el.dataset.level)][el.dataset.key]=value;}
else if(el.dataset.node!==undefined){const c=selectedComponent();const idx=Number(el.dataset.node);c.hiddenNodes=c.hiddenNodes||[];if(el.checked)c.hiddenNodes=c.hiddenNodes.filter(x=>x!==idx);else c.hiddenNodes.push(idx);markPageDirty();render();}
else if(el.dataset.cfg){setPath(currentGame(),el.dataset.cfg,value);markDirty();error='';render();}
else if(el.dataset.tier!==undefined){const t=currentGame().tiers[Number(el.dataset.tier)];t[el.dataset.key]=value;if(el.dataset.key==='amount'&&t.rewardType==='cash')t.name=value+'元现金红包';if(el.dataset.key==='rewardType'){t.name=value==='cash'?t.amount+'元现金红包':value==='physical'?'九方定制保温杯':'社区限定头像框';}markDirty();render();}
else if(el.dataset.prize!==undefined){currentGame().prizes[Number(el.dataset.prize)][el.dataset.key]=value;markDirty();render();}
else if(el.dataset.slot!==undefined){currentGame().reward.slots[Number(el.dataset.slot)][el.dataset.key]=value;markDirty();render();}
else if(el.dataset.selectAction){if(el.checked)selectedActions.add(el.dataset.selectAction);else selectedActions.delete(el.dataset.selectAction);renderModal();}
else if(el.dataset.temp){tempTask[el.dataset.temp]=value;if(['hasLevels','statistics'].includes(el.dataset.temp))renderModal();}
else if(el.dataset.ui){state[el.dataset.ui]=value;render();}
else if(el.dataset.prop){const c=selectedComponent();if(el.dataset.prop==='accent'&&!/^#[0-9a-f]{6}$/i.test(value)){toast('请输入有效的六位颜色值',true);render();return;}c[el.dataset.prop]=value;if(el.dataset.prop==='bind')c.taskIds=[];markPageDirty();render();}
else if(el.dataset.page){currentPage()[el.dataset.page]=value;markPageDirty();render();}
else if(el.dataset.taskVisible){const c=selectedComponent(),g=state.games[c.bind];if(!c.taskIds.length)c.taskIds=g.tasks.map(t=>t.id);if(el.checked){if(!c.taskIds.includes(el.dataset.taskVisible))c.taskIds.push(el.dataset.taskVisible);}else{if(c.taskIds.length===1){toast('任务列表至少保留一个任务',true);render();return;}c.taskIds=c.taskIds.filter(id=>id!==el.dataset.taskVisible);}markPageDirty();render();}
else if(el.dataset.upload){const file=el.files[0];if(!file)return;if(file.size>2*1024*1024){toast('图片不能超过2MB',true);return;}if(!['image/png','image/jpeg','image/webp'].includes(file.type)){toast('请选择PNG、JPG或WebP图片',true);return;}const c=selectedComponent();const reader=new FileReader();reader.onload=()=>{c.image=reader.result;markPageDirty();render();toast('图片已添加到本地画布');};reader.readAsDataURL(file);}}
app.addEventListener('change',handleChange);overlays.addEventListener('change',handleChange);
let dragData=null;
app.addEventListener('dragstart',e=>{const t=e.target.closest('[data-drag-type],[data-drag-id]');if(!t||e.target.closest('input,textarea,select'))return;dragData=t.dataset.dragType?{type:t.dataset.dragType}:{id:t.dataset.dragId};e.dataTransfer.setData('text/plain',JSON.stringify(dragData));e.dataTransfer.effectAllowed='copyMove';});
app.addEventListener('dragover',e=>{if(!dragData)return;const t=e.target.closest('.canvas-item,#phone-canvas');if(t){e.preventDefault();document.querySelectorAll('.drag-over').forEach(x=>x.classList.remove('drag-over'));if(t.classList.contains('canvas-item'))t.classList.add('drag-over');}});
app.addEventListener('drop',e=>{const t=e.target.closest('.canvas-item,#phone-canvas');if(!dragData||!t)return;e.preventDefault();e.stopPropagation();const p=currentPage();let index=t.dataset.id?p.components.findIndex(c=>c.id===t.dataset.id):p.components.length;if(dragData.type)addComponent(dragData.type,index);else{const from=p.components.findIndex(c=>c.id===dragData.id);if(from>=0&&p.components[from]?.id!==t.dataset.id){const c=p.components.splice(from,1)[0];if(from<index)index--;p.components.splice(index,0,c);state.selected=c.id;markPageDirty();render();}}dragData=null;});
app.addEventListener('dragend',()=>{dragData=null;document.querySelectorAll('.drag-over').forEach(x=>x.classList.remove('drag-over'));});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.canvas-item')){e.preventDefault();e.target.click();return;}if(e.key==='Escape'&&modal){modal=null;renderModal();}if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();if(state.workspace==='builder')currentPage().savedAt=now();else currentGame().savedAt=now();persist();render();toast('本地草稿已保存');}});
window.addEventListener('message',e=>{if(e.source!==window.parent)return;if(e.data?.type==='jiufang-pc-restore'&&e.data.state?.version===5&&!storageAvailable){state=e.data.state;state.preview=false;render();}});
window.addEventListener('resize',notifyHeight);
render();try{window.parent.postMessage({type:'jiufang-pc-ready'},'*');}catch{}
})();
</script></body>
</html>
